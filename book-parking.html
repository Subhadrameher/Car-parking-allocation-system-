<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Parking | ParkFlow</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark small">P</span> ParkFlow</a><p class="nav-caption">MY PARKFLOW</p><nav><a class="nav-link" href="dashboard.html">▦ Dashboard</a><a class="nav-link active" href="book-parking.html">＋ Book parking</a><a class="nav-link" href="my-bookings.html">▤ My bookings</a><a class="nav-link" href="profile.html">◉ Profile</a></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">RESERVATIONS</p><h1>Book a parking space</h1><p class="muted">Choose your vehicle, duration and an available slot.</p></div><button class="btn outline" data-logout>Sign out</button></header><section class="content-grid"><article class="panel"><h2>Choose a space</h2><p class="muted">Green spaces are available. Select one to continue.</p><div id="userSlotGrid" class="slot-grid"></div></article><article class="panel"><h2>Booking details</h2><form id="bookingForm" class="stack"><label>Vehicle registration<input class="input" id="bookingPlate" placeholder="TS 09 AB 1234" required></label><label>Vehicle type<select class="input" id="bookingType"><option>Car</option><option>Bike</option><option>SUV</option><option>EV</option></select></label><label>Booking date<input class="input" id="bookingDate" type="date" required></label><label>Start time<input class="input" id="bookingStart" type="time" required></label><label>Duration<select class="input" id="bookingDuration"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option><option value="8">8 hours</option></select></label><div class="price-box"><span>Estimated total</span><strong id="bookingPrice">₹30</strong></div><button class="btn primary wide">Continue to payment →</button><p id="bookingMessage" class="form-message"></p></form></article></section></main></div><script src="../assets/js/config.js"></script><script src="../assets/js/parking.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/user.js"></script><script src="../assets/js/payment.js"></script></body></html>
